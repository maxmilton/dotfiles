# https://chatgpt.com/share/6a8542f5-774c-83ec-ac7b-06a66e3232a5
# https://github.com/mpv-player/mpv/blob/master/etc/builtin.conf
# https://github.com/mpv-player/mpv/blob/master/DOCS/man/options.rst

# Video output / decode
vo=gpu-next
gpu-api=vulkan
hwdec=auto
vulkan-swap-mode=fifo

# Spatial reconstruction
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell

# Video processing
deinterlace=auto # toggle with "d"
deband=yes       # toggle with "b"
dither=fruit     # cycle with "D"
interpolation=no # toggle with "i"
video-sync=display-resample # smooth video but resamples audio

# Audio / subtitles
volume-max=100
sub-auto=fuzzy
sub-fix-timing=yes
sub-ass-override=strip
slang=en,ko

# General
screenshot-directory=~/Pictures
reset-on-next-file=audio-delay,mute,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume,cache-pause-initial,cache-pause-wait,cache-secs,demuxer-hysteresis-secs,demuxer-max-bytes

ytdl-format=bestvideo[height<=?2160][fps<=?60]+bestaudio/best
ytdl-raw-options-append="sub-langs=en.*,sleep-interval=4,write-sub=,write-auto-sub="

# # For Samsung M7 43 monitor in HDR mode + "entertain" picture mode
# icc-profile-auto=no
# # target-prim=dci-p3
# # target-trc=pq # ST2084
# target-contrast=5000
# target-peak=330 # 110% of panel spec
# # tone-mapping=bt.2390
# # tone-mapping-param=0.8
# gamut-mapping-mode=perceptual

# For SDR display
# HDR -> SDR: skip expensive dynamic peak analysis
hdr-compute-peak=no

[protocol.http]
cache-pause-initial=yes
cache-pause-wait=5
cache-secs=10
demuxer-hysteresis-secs=5
demuxer-max-bytes=512M

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http

# XXX: Only use with HDR monitors.
# # https://github.com/mpv-player/mpv/discussions/15394#discussioncomment-11433858
# [hdr]
# profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
# profile-restore=copy-equal
# allow-delayed-peak-detect=yes
# hdr-compute-peak=yes
# hdr-peak-percentile=99.995
# hdr-contrast-recovery=0.30

[low-fps]
profile-cond=container_fps > 0 and container_fps < 30
profile-restore=copy-equal
video-sync=display-resample
interpolation=yes
tscale=oversample

# [upscale]
# profile-cond=height < display_height and estimated_frame_count > 2
# profile-restore=copy-equal
# scale=ewa_lanczos4sharpest
# # scale-antiring=0.6

[heavy-decode] # activate with "alt+3"
profile-cond=(video_format == 'vp9' or video_format == 'av1') and (height > 1080 or height >= display_height)
profile-restore=copy-equal
video-sync=audio
deband=no
scale=lanczos
cscale=lanczos
glsl-shaders=""

[anime1] # activate with "alt+1"
profile-restore=copy-equal
# deband=no
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl"

[anime2] # activate with "alt+2"
profile-restore=copy-equal
# deband=no
glsl-shaders="~~/shaders/ArtCNN_C4F16_DS.glsl"

[nogpu] # activate with "alt+4"
vo=wlshm
profile=sw-fast

[lowend] # activate with "alt+5"
profile=fast
profile-restore=copy-equal
vo=gpu
gpu-api=auto
hwdec=auto
video-sync=display-desync
cscale=bilinear
glsl-shaders=""

[hifi audio] # activate with "alt+8"
profile-restore=copy-equal
audio-device=auto
video-sync=audio
audio-channels=stereo
audio-normalize-downmix=no
af=""

# Audio profile for FiiO K3 DAC
[k3] # activate with "alt+9"
profile="hifi audio"
profile-restore=copy-equal
audio-device="alsa/front:CARD=K3,DEV=0"
audio-exclusive=yes
audio-format=s32
