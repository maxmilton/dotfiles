Ctrl+1 set sub-scale 1.0
Ctrl+2 add sub-scale -0.05
Ctrl+3 add sub-scale +0.05
i cycle interpolation
D cycle dither

Alt+0 script-binding reset-state
Alt+1 apply-profile "anime1"; show-text "Profile: anime1"
Alt+2 apply-profile "anime2"; show-text "Profile: anime2"
Alt+3 apply-profile "heavy-decode"; show-text "Profile: heavy-decode"
Alt+4 apply-profile "nogpu"; show-text "Profile: nogpu"
Alt+5 apply-profile "lowend"; show-text "Profile: lowend"
Alt+8 apply-profile "hifi audio"; show-text "Profile: hifi audio"
Alt+9 apply-profile "k3"; show-text "Profile: k3"

HOME set time-pos 0

Alt+- add video-zoom -0.25
Alt+= add video-zoom 0.25

# Loop X number of times (Ctrl+L to inf loop)
Ctrl+l cycle loop-playlist

