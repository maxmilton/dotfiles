"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

# TODO: Remove once we have git sync?
# TIP: Workflow reminder:
# jj git fetch
# jj rebase -d 'bookmarks(master)' --skip-emptied
# jj rebase -d 'bookmarks(next)' --skip-emptied
# jj simplify-parents -r @

# TIP: What is immutable?: https://github.com/jj-vcs/jj/discussions/5669#discussioncomment-12178856

# REF: https://oppi.li/posts/configuring_jujutsu/
# REF: https://github.com/sunshowers/dotfiles/blob/main/dot_jjconfig.toml

[user]
name = "Max Milton"
email = "max@2okki.com"

[signing]
behavior = "own"
backend = "gpg"
# nosemgrep: generic-api-key
key = "C174762F23AF46AF" # max@2okki.com [S]

[aliases]
b = ["log", "-r", "@ | ancestors(remote_bookmarks().., 2) | trunk()"]
l = ["log", "-r", "::@", "-T", "builtin_log_comfortable"]
ll = ["log", "-r", "::@", "-T", 'builtin_log_comfortable ++ diff.stat(72) ++ "\n"']
s = ["show", "@-"]
# TODO: Follow along with git sync implementation: https://github.com/jj-vcs/jj/pull/6826
sync = ["git", "sync"]
tug = ["bookmark", "advance"]

[revsets]
bookmark-advance-to = "@-" # squash based workflow

# [revset-aliases]
# 'HEAD' = '@-'
# 'MOD' = 'latest(::@ ~ empty())'

[ui]
default-command = "log" # "log" = "jj", "status" = "j" shell alias
pager = ":builtin"
merge-editor = "mergiraf"

[ui.streampager]
interface = "quit-quickly-or-clear-output"
