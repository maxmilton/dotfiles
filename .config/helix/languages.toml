# TODO: Remove once natively supported: https://github.com/helix-editor/helix/pull/16026
[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]
[language-server.tsc.config.typescript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true
[language-server.tsc.config.javascript]
format.enabled = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes.enabled = true
inlayHints.parameterTypes.enabled = true
inlayHints.parameterNames.enabled = "all"
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true

[[language]]
name = "markdown"
text-width = 80
soft-wrap = { wrap-at-text-width = true }

# Extend scss language to include *.xcss files
[[language]]
name = "scss"
file-types = ["scss", "xcss"]

[[language]]
name = "javascript"
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
  { name = "oxlint", except-features = ["format"] },
  { name = "oxfmt", only-features = ["format"] },
  # "bun",
]
auto-format = true

[[language]]
name = "typescript"
language-servers = [
  { name = "tsc", except-features = ["format"] },
  "biome",
  { name = "oxlint", except-features = ["format"] },
  { name = "oxfmt", only-features = ["format"] },
  # "bun",
]
auto-format = true

# Fall back to ini for any undefined .conf file
# TODO: Periodically check upstream languages.toml for "conf" language
# definition, as we don't want to override it.
[[language]]
name = "conf"
scope = "source.conf"
file-types = ["conf"]
comment-tokens = "#"
grammar = "ini"

# FIXME: Remove once PR is merged and released: https://github.com/helix-editor/helix/pull/16365
[[language]]
name = "jsonc"
file-types = [
  "jsonc",
  { glob = "{t,j}sconfig.json" },
  { glob = "bun.lock" },
  { glob = ".devcontainer.json" },
  { glob = "devcontainer.json" },
  { glob = ".vscode/*.json" },
  "code-workspace",
]
